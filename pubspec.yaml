name: news_app
description: "A premium, production-ready Flutter News Application built with Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  #Splash Screen
  flutter_native_splash: ^2.4.7

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.3.0

  # Local persistence (settings, bookmarks, recent searches)
  shared_preferences: ^2.2.3

  # Value equality for models/entities
  equatable: ^2.0.5

  # Shimmer loading skeletons
  shimmer: ^3.0.0

  # Cached-style image placeholder handling (kept local-asset only per requirements)
  # (No network image packages included by design — see README)

  # Share article
  share_plus: ^13.2.1

  # Utility: url launching for "copy link" / share targets, external article links
  url_launcher: ^6.3.0

  # Icons
  cupertino_icons: ^1.0.6

  # Connectivity awareness (offline-ready architecture)
  connectivity_plus: ^7.3.0

  # intl for date formatting / i18n scaffolding
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Add custom fonts here if desired, e.g.:
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
